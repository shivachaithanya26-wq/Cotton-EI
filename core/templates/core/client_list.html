{% extends "core/base.html" %}
{% block title %}Clients{% endblock %}
{% block content %}
<h3>Clients (Sellers)</h3>
<div class="row">
  <div class="col-md-5">
    <form method="post" class="card p-3">
      {% csrf_token %}
      <div class="mb-2"><label class="form-label">Name</label>{{ form.name }}</div>
      <div class="mb-2"><label class="form-label">Phone</label>{{ form.phone }}</div>
      <div class="mb-2"><label class="form-label">Address</label>{{ form.address }}</div>
      <button class="btn btn-success">Add Client</button>
    </form>
  </div>
  <div class="col-md-7">
    <table class="table table-sm">
      <thead><tr><th>Name</th><th>Phone</th></tr></thead>
      <tbody>
      {% for c in clients %}
        <tr><td>{{ c.name }}</td><td>{{ c.phone }}</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
